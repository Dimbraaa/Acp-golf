<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Approche Chip Putt</title>
<style>
  :root {
    --green: #1F4D3A; --green2: #2E6B4A; --green-soft: #E6EFE9;
    --bg: #F5F1E8; --card: #fff; --text: #18211D; --muted: #5E6A63; --line: #DAD6CB;
    --gold: #E3AE45; --a: #1E5A85; --c: #B8582A; --p: #2E7D4F; --danger: #B3261E;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  button, select, input { font: inherit; color: inherit; }
  button { touch-action: manipulation; cursor: pointer; -webkit-user-select: none; user-select: none; }

  header.top {
    position: sticky; top: 0; z-index: 10; background: var(--green); color: #fff;
    padding: calc(env(safe-area-inset-top) + 8px) 8px 8px; display: flex; align-items: center; gap: 4px; min-height: 52px;
  }
  header.top h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { background: none; border: none; color: #fff; font-size: 16px; font-weight: 600; padding: 10px 8px; min-width: 84px; text-align: left; }
  .hbtn.right { text-align: right; }
  .hbtn:active { opacity: .6; }

  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 112px); }
  .bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(245,241,232,.97);
    border-top: 1px solid var(--line); padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
  }
  .bottombar .inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

  .btn { display: block; width: 100%; min-height: 54px; border-radius: 14px; border: 2px solid transparent; font-size: 17px; font-weight: 700; padding: 0 16px; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--green2); color: #fff; }
  .btn-secondary { background: #fff; color: var(--green2); border-color: var(--green2); }
  .btn-danger { background: #fff; color: var(--danger); border-color: #EDC9C6; }
  .link { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 15px; padding: 10px; display: block; margin: 4px auto 0; }
  .link.danger { color: var(--danger); }

  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 4px 8px; }

  /* Formulaire */
  label.field { display: block; font-weight: 600; margin-bottom: 6px; }
  .input { width: 100%; height: 50px; border: 2px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 17px; background: #fff; }
  .input:focus { outline: none; border-color: var(--green2); }
  .player-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .player-row .input { flex: 1; }
  .icon-btn { width: 50px; height: 50px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 22px; color: var(--danger); }
  .seg { display: flex; background: #E8E3D6; border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; height: 44px; border: none; border-radius: 9px; background: transparent; font-weight: 700; font-size: 16px; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--green); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .err { color: var(--danger); font-weight: 600; margin-top: 10px; }
  .seg button:disabled { opacity: .4; }
  .player-row .input.hcp { flex: 0 0 74px; width: 74px; text-align: center; padding: 0 6px; }

  /* 4-2-0 */
  .holeinfo { color: var(--muted); font-weight: 600; font-size: 14px; margin: -4px 4px 12px; }
  .sp { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #ECE8DE; }
  .sp:last-child { border-bottom: none; }
  .sp .spn { flex: 1; min-width: 0; }
  .sp .nm { font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp .sub { font-size: 13px; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 46px; height: 46px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 24px; font-weight: 700; color: var(--green2); padding: 0; }
  .stepper button:active { background: var(--green-soft); }
  .stepper .val { width: 36px; text-align: center; font-size: 26px; font-weight: 800; }
  .stepper .xbtn { color: var(--danger); font-size: 20px; margin-left: 4px; }
  .stepper .xbtn.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  .sp.picked .val { color: var(--danger); }
  .sp.picked .nm { color: var(--muted); }
  table.s420 td { padding: 6px 2px; line-height: 1.15; }
  table.s420 th.par, table.s420 td.par { width: 40px; color: var(--muted); font-weight: 600; }
  table.s420 th.par { color: rgba(255,255,255,.75); }
  table.s420 .sv { font-size: 17px; font-weight: 800; }
  table.s420 .sv sup { font-size: 10px; color: var(--muted); margin-left: 1px; }
  table.s420 .spt { font-size: 11px; color: var(--green2); font-weight: 700; }
  table.s420 tfoot tr.cumrow td { font-size: 14px; font-weight: 700; background: #F1F5F2; color: var(--muted); }
  /* Écran trou */
  .holehead { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 10px; }
  .holehead .num { font-size: 30px; font-weight: 800; }
  .holehead .prog { color: var(--muted); font-weight: 600; }
  .totals { display: grid; gap: 6px; margin-bottom: 14px; }
  .tot { background: #fff; border-radius: 12px; padding: 8px 6px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.06); min-width: 0; }
  .tot .n { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tot .v { font-size: 24px; font-weight: 800; line-height: 1.1; }
  .tot .d { font-size: 12px; font-weight: 700; color: var(--green2); min-height: 15px; }
  .point { background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 12px; border-left: 6px solid var(--cat); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .point .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .point .pt { font-size: 21px; font-weight: 800; color: var(--cat); }
  .point .hint { font-size: 13px; color: var(--muted); text-align: right; }
  .choices { display: grid; gap: 8px; margin-top: 10px; }
  .choice { min-height: 62px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 18px; font-weight: 700; padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .choice.sel { background: var(--cat); border-color: var(--cat); color: #fff; }
  .choice.sel::before { content: "✓ "; }
  .nobody { font-size: 13px; color: var(--muted); margin-top: 8px; text-align: center; min-height: 17px; }
  .editbanner { background: #FBF1DC; border: 2px solid #E3AE45; color: #7A5310; border-radius: 12px; padding: 10px 12px; font-weight: 600; margin-bottom: 12px; }

  /* Carte de score */
  .winner { background: var(--green); color: #fff; border-radius: 16px; padding: 18px; text-align: center; margin-bottom: 14px; }
  .winner .big { font-size: 22px; font-weight: 800; }
  .rank { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid #ECE8DE; }
  .rank:last-child { border-bottom: none; }
  .rank .pos { width: 34px; font-weight: 800; color: var(--muted); }
  .rank .nm { flex: 1; font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .pts { font-weight: 800; font-size: 20px; }
  .rank .det { font-size: 12px; color: var(--muted); }
  table.sc { width: 100%; border-collapse: collapse; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); table-layout: fixed; }
  table.sc th, table.sc td { padding: 9px 2px; text-align: center; border-bottom: 1px solid #ECE8DE; font-size: 15px; }
  table.sc th { background: var(--green); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.sc th:first-child, table.sc td:first-child { width: 52px; font-weight: 800; }
  table.sc tbody tr { cursor: pointer; }
  table.sc tbody tr:active { background: #EEF3EF; }
  table.sc tr.cur td { background: #FBF1DC; }
  table.sc tr.todo td { color: #A9ADA3; }
  table.sc tfoot td { background: var(--green-soft); font-weight: 800; font-size: 18px; border-bottom: none; }
  .bd { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 800; margin: 1px; }
  .bd.a { background: var(--a); } .bd.c { background: var(--c); } .bd.p { background: var(--p); }
  .legend { display: flex; gap: 14px; justify-content: center; margin: 10px 0 0; font-size: 13px; color: var(--muted); align-items: center; flex-wrap: wrap; }

  /* Accueil */
  .hero { text-align: center; padding: 8px 0 16px; }
  .hero img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 2px 8px rgba(31,77,58,.25); }
  .hist { display: flex; align-items: center; gap: 10px; padding: 12px 2px; border-bottom: 1px solid #ECE8DE; background: none; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; }
  .hist:last-child { border-bottom: none; }
  .hist .t { flex: 1; min-width: 0; }
  .hist .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { color: #A9ADA3; font-size: 22px; }
  details.rules summary { font-weight: 700; cursor: pointer; padding: 4px 0; }
  details.rules p, details.rules li { font-size: 15px; line-height: 1.45; }
  details.rules ul { padding-left: 20px; margin: 6px 0; }

  /* Modale & toast */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); }
  .sheet { background: #fff; border-radius: 18px; padding: 20px; width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; }
  .sheet p { font-size: 17px; margin: 0 0 16px; line-height: 1.4; }
  .sheet .btns { display: flex; flex-direction: column; gap: 8px; }
  .sheet img { width: 100%; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 12px; }
  /* Écran de lancement */
  #splash { position: fixed; inset: 0; z-index: 100; background: var(--green); color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px; overflow: hidden; transition: opacity .5s ease, visibility .5s; }
  #splash.hide { opacity: 0; visibility: hidden; }
  #splash .mark { width: 64vw; max-width: 290px; height: auto; animation: splashPop .6s cubic-bezier(.2,.8,.25,1.15) both; }
  #splash .mark .ball { transform-box: fill-box; transform-origin: center; animation: splashDrop .55s .35s cubic-bezier(.3,1.4,.5,1) both; }
  #splash .sname { font-size: 22px; font-weight: 800; letter-spacing: .02em; margin-top: 26px; animation: splashFade .5s .3s both; }
  #splash .stag { font-size: 16px; font-weight: 600; color: var(--gold); margin-top: 8px; animation: splashFade .5s .55s both; }
  #splash .hill { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 22vh; }
  @keyframes splashPop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
  @keyframes splashDrop { from { opacity: 0; transform: translateY(-160%); } to { opacity: 1; transform: none; } }
  @keyframes splashFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: none !important; } }
  .hero .appname { font-size: 20px; font-weight: 800; margin-top: 10px; color: var(--green); }
  .hero .tagline { font-size: 15px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .winner { border-bottom: 5px solid var(--gold); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 66px); z-index: 60; background: #18211D; color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 15px; }
</style>

<div id="splash" aria-hidden="true">
  <svg class="mark" viewBox="28 118 476 244" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
      <path d="M56 330 L114 168 L172 330 M78 272 H150"/>
      <path d="M342 187 A81 81 0 1 0 342 311"/>
      <path d="M402 330 V146"/>
    </g>
    <circle class="ball" cx="290" cy="249" r="24" fill="#E3AE45"/>
    <path d="M402 158 H430 A54 54 0 0 1 430 266 H402 Z" fill="#E3AE45"/>
  </svg>
  <div class="sname">Approche · Chip · Putt</div>
  <div class="stag">Tu t'occupes du jeu, je m'occupe du score</div>
  <svg class="hill" viewBox="0 0 100 20" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 8 Q50 -4 100 8 V20 H0 Z" fill="#2E6B4A"/></svg>
</div>
<div id="app"></div>
<div id="modal"></div>

<script>
'use strict';

/* ---------- Données ---------- */
const KEY = 'acp-golf-v1';
const TAGLINE = "Tu t'occupes du jeu, je m'occupe du score";
const CATS = [
  { k: 'a', name: 'Approche', letter: 'A', color: '#1E5A85', hint: '1er sur le green' },
  { k: 'c', name: 'Chip',     letter: 'C', color: '#B8582A', hint: 'Le plus près, tous sur le green' },
  { k: 'p', name: 'Putt',     letter: 'P', color: '#2E7D4F', hint: '1er dans le trou' }
];

// Parcours connus (par + handicap de trou « si », 1 = trou le plus difficile)
const COURSES = [
  { id: 'valcros', name: 'Golf de Valcros', holes: [[5,11],[3,15],[4,3],[3,13],[4,17],[4,1],[3,9],[4,7],[5,5],[3,10],[4,16],[5,12],[5,2],[3,18],[4,8],[4,4],[3,6],[4,14]] },
  { id: 'valgarde', name: 'Golf de Valgarde', holes: [[4,5],[3,7],[4,15],[3,11],[4,3],[4,1],[3,9],[4,17],[5,13],[3,6],[4,4],[3,18],[4,8],[4,2],[4,10],[4,12],[3,16],[5,14]] },
  { id: 'barbaroux', name: 'Golf de Barbaroux', holes: [[4,7],[4,9],[5,11],[3,17],[5,1],[4,3],[4,13],[3,15],[4,5],[4,12],[4,16],[5,4],[4,8],[4,14],[3,18],[4,6],[5,2],[3,10]] }
];
const courseById = (id) => COURSES.find((c) => c.id === id);

/* ---------- Formule 4-2-0 (3 joueurs) / 6-4-2-0 (4 joueurs) ---------- */
const PICKED = 'x'; // balle ramassée
const fmtOf = (g) => g.fmt || 'acp';
const placePoints = (n) => (n === 4 ? [6, 4, 2, 0] : [4, 2, 0]);
const fmt420Name = (n) => (n === 4 ? '6-4-2-0' : '4-2-0 (la Chouette)');
// Coups reçus sur un trou : partie entière de H / 18, plus 1 si SI ≤ (H modulo 18)
function strokesReceived(H, si) {
  H = Math.max(0, Math.floor(+H || 0));
  if (!si) return 0;
  return Math.floor(H / 18) + (si <= H % 18 ? 1 : 0);
}
// Score retenu pour le classement du trou (Infinity = balle ramassée)
function holeScore(g, hole, i) {
  const s = hole.s[i];
  if (s === PICKED || s === null || s === undefined) return Infinity;
  return g.mode === 'net' ? s - strokesReceived(g.hcp[i], hole.si) : s;
}
// Points de chaque joueur sur un trou : les joueurs à égalité se partagent la somme des points de leurs places
function holePoints(g, hole) {
  const n = g.players.length;
  const pp = placePoints(n);
  const sc = g.players.map((_, i) => holeScore(g, hole, i));
  const order = sc.map((v, i) => i).sort((a, b) => sc[a] - sc[b] || a - b);
  const pts = new Array(n).fill(0);
  let k = 0;
  while (k < n) {
    let j = k;
    while (j + 1 < n && sc[order[j + 1]] === sc[order[k]]) j++;
    const share = pp.slice(k, j + 1).reduce((s, v) => s + v, 0) / (j - k + 1);
    for (let m = k; m <= j; m++) pts[order[m]] = share;
    k = j + 1;
  }
  return pts;
}
// Score affiché = total cumulé − plus petit total cumulé
function displayScores(cum) {
  const min = Math.min(...cum);
  return cum.map((v) => v - min);
}
const fmtLabel = (g) => (fmtOf(g) === '420' ? `${fmt420Name(g.players.length)} · ${g.mode === 'net' ? 'Net' : 'Brut'}` : 'Approche Chip Putt');

let S = load();

function blank() {
  return { games: [], last: { players: ['', ''], course: '' }, ui: { screen: 'home' } };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.games) && s.ui) return s;
  } catch (e) {}
  return blank();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ Sauvegarde impossible'); }
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getGame = (id) => S.games.find((g) => g.id === id);
const activeGame = () => S.games.find((g) => g.status === 'playing');
const currentIdx = (g) => g.holes.findIndex((h) => !h.done);
const fmtDate = (iso, long) => new Date(iso).toLocaleDateString('fr-FR', long
  ? { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }
  : { day: 'numeric', month: 'short', year: 'numeric' });

// Trous à afficher : ceux du jeu, en remplaçant éventuellement un trou par son brouillon (correction en cours)
function holesView(g) {
  const u = S.ui;
  if (u.draft && u.gameId === g.id) return g.holes.map((h, i) => (i === u.holeIdx ? u.draft : h));
  return g.holes;
}
// Trou en cours de saisie : le trou courant de la partie, ou le brouillon d'une correction
function editableHole(g) {
  const live = g.status === 'playing' && S.ui.holeIdx === currentIdx(g);
  return live ? g.holes[S.ui.holeIdx] : S.ui.draft;
}
function totals(g, holes) {
  holes = holes || g.holes;
  const t = g.players.map(() => ({ pts: 0, a: 0, c: 0, p: 0 }));
  holes.forEach((h) => CATS.forEach((c) => { if (h[c.k] !== null) { t[h[c.k]].pts++; t[h[c.k]][c.k]++; } }));
  return t;
}
// 4-2-0 : cum = points cumulés (brut, sert au contrôle), pts = score affiché (avance sur le dernier)
function totals420(g, holes) {
  holes = holes || g.holes;
  const t = g.players.map(() => ({ cum: 0, strokes: 0, picked: 0, played: 0 }));
  holes.forEach((h) => {
    if (!h.done) return;
    holePoints(g, h).forEach((v, i) => {
      t[i].cum += v; t[i].played++;
      if (h.s[i] === PICKED) t[i].picked++; else t[i].strokes += h.s[i];
    });
  });
  const d = displayScores(t.map((x) => x.cum));
  t.forEach((x, i) => { x.pts = d[i]; });
  return t;
}
const anyTotals = (g, holes) => (fmtOf(g) === '420' ? totals420(g, holes) : totals(g, holes));
function ranking(g) {
  const t = anyTotals(g);
  const r = g.players.map((n, i) => ({ i, n, ...t[i] })).sort((x, y) => y.pts - x.pts);
  r.forEach((o, k) => { o.rank = k > 0 && o.pts === r[k - 1].pts ? r[k - 1].rank : k + 1; });
  return r;
}
const rankLabel = (r) => (r === 1 ? '1er' : r + 'e');
function winnerText(g) {
  const r = ranking(g);
  const top = r.filter((o) => o.rank === 1);
  if (top.length === 1) return `🏆 ${esc(top[0].n)} gagne avec ${top[0].pts} point${top[0].pts > 1 ? 's' : ''}`;
  return `🤝 Égalité : ${top.map((o) => esc(o.n)).join(' & ')} (${top[0].pts} pts)`;
}

/* ---------- Navigation ---------- */
function go(ui) { S.ui = ui; save(); render(); window.scrollTo(0, 0); }

/* ---------- Rendu ---------- */
function render() {
  const u = S.ui;
  let g = u.gameId ? getGame(u.gameId) : null;
  if ((u.screen === 'hole' || u.screen === 'card') && !g) { S.ui = { screen: 'home' }; return render(); }
  let html = '';
  if (u.screen === 'setup') html = viewSetup();
  else if (u.screen === 'hole') html = fmtOf(g) === '420' ? viewHole420(g) : viewHole(g);
  else if (u.screen === 'card') html = fmtOf(g) === '420' ? viewCard420(g) : viewCard(g);
  else html = viewHome();
  document.getElementById('app').innerHTML = html;
}

function holeNumbers(count, start) { return Array.from({ length: count }, (_, i) => ((start - 1 + i) % 18) + 1); }
function seqText(f) { const s = holeNumbers(f.count, f.start); return `Trous joués : ${s[0]} → ${s[s.length - 1]}`; }

function cell420(g, ho, i) {
  if (!ho.done) return '';
  const s = ho.s[i];
  const rec = g.mode === 'net' ? strokesReceived(g.hcp[i], ho.si) : 0;
  const pts = holePoints(g, ho)[i];
  return `<div class="sv">${s === PICKED ? '<span style="color:var(--danger)">✕</span>' : s}${rec ? `<sup>${'•'.repeat(Math.min(rec, 3))}</sup>` : ''}</div><div class="spt">${pts} pt${pts > 1 ? 's' : ''}</div>`;
}

function viewCard420(g) {
  const playing = g.status === 'playing';
  const ci = currentIdx(g);
  const r = ranking(g);
  const t = totals420(g);
  const hasPar = g.holes.some((x) => x.par);
  const doneHoles = g.holes.filter((x) => x.done).length;
  const sumCum = t.reduce((s, x) => s + x.cum, 0);
  const per = placePoints(g.players.length).reduce((s, v) => s + v, 0);
  let h = header(`<button class="hbtn" data-act="${playing ? 'resume' : 'home'}">‹ ${playing ? 'Trou' : 'Accueil'}</button>`, 'Carte de score', '');

  if (!playing) h += `<div class="winner"><div class="big">${winnerText(g)}</div><div class="small" style="opacity:.85;margin-top:4px">${esc(fmtLabel(g))}<br>${sub}</div></div>`;
  else h += `<div class="muted small" style="margin:0 4px 10px">${esc(fmtLabel(g))} · ${sub} · partie en cours</div>`;
  h += `<div class="card" style="padding:6px 14px">`;
  r.forEach((o) => {

    if (g.mode === 'net') det.push(`hcp ${g.hcp[o.i]}`);
    h += `<div class="rank"><span class="pos">${rankLabel(o.rank)}</span><span class="nm">${esc(o.n)}</span>
      <span style="text-align:right"><div class="pts">${o.pts} pt${o.pts > 1 ? 's' : ''}</div><div class="det">${det.join(' · ')}</div></span></div>`;
  });
  h += `</div>`;
  h += `<table class="sc s420"><thead><tr><th>Trou</th>${hasPar ? '<th class="par">Par</th>' : ''}${g.players.map((p) => `<th>${esc(p)}</th>`).join('')}</tr></thead><tbody>`;
  g.holes.forEach((ho, idx) => {
    const cls = playing && idx === ci ? 'cur' : (!ho.done ? 'todo' : '');
    h += `<tr class="${cls}" data-act="openHole" data-idx="${idx}"><td>${ho.n}</td>${hasPar ? `<td class="par">${ho.par || ''}</td>` : ''}${g.players.map((_, i) => `<td>${cell420(g, ho, i)}</td>`).join('')}</tr>`;
  });
  const pad = hasPar ? '<td class="par"></td>' : '';
  h += `</tbody><tfoot><tr class="cumrow"><td>Pts</td>${pad}${t.map((x) => `<td>${x.cum}</td>`).join('')}</tr>

  h += `<p class="muted small" style="text-align:center;margin-bottom:2px">Score = points cumulés − ceux du dernier.${g.mode === 'net' ? ' • = coup reçu.' : ''} ✕ = balle ramassée.</p>`;
  if (doneHoles) h += `<p class="small" style="text-align:center;margin-top:2px;color:${sumCum === per * doneHoles ? 'var(--green2)' : 'var(--danger)'}">Contrôle : ${sumCum} points distribués sur ${doneHoles} trou${doneHoles > 1 ? 's' : ''} (${per} par trou) ${sumCum === per * doneHoles ? '✓' : '⚠️'}</p>`;
  h += `<p class="muted small" style="text-align:center">Touchez un trou joué pour le corriger.</p>`;
  if (!playing) h += `<button class="link danger" data-act="deleteGame">Supprimer cette partie</button>`;
  h += '</main>';
  h += `<div class="bottombar"><div class="inner"><button class="btn btn-primary" data-act="share">📤 Partager la carte</button></div></div>`;
  return h;

function badges(h, i) {

}

/* ---------- Modale / toast ---------- */
function confirmBox(msg, okLabel, danger) {
  return new Promise((resolve) => {
    const m = document.getElementById('modal');
    m.innerHTML = `<div class="overlay"><div class="sheet"><p>${msg}</p><div class="btns">
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="mOk">${okLabel}</button>
      <button class="btn btn-secondary" id="mNo">Annuler</button></div></div></div>`;
    const close = (v) => { m.innerHTML = ''; resolve(v); };
    m.querySelector('#mOk').onclick = () => close(true);
    m.querySelector('#mNo').onclick = () => close(false);
    m.querySelector('.overlay').onclick = (e) => { if (e.target.classList.contains('overlay')) close(false); };
  });
}
let toastTimer;
function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2200);
}

/* ---------- Actions ---------- */
const A = {
  home: () => go({ screen: 'home' }),

  async newGame() {
    const g = activeGame();
    if (g && !(await confirmBox('Une partie est en cours. La supprimer pour en commencer une nouvelle ?', 'Supprimer et recommencer', true))) return;
    if (g) S.games = S.games.filter((x) => x.id !== g.id);
    const last = S.last || { players: ['', ''], course: '' };
    const players = last.players && last.players.length >= 2 ? [...last.players] : ['', ''];
    const hcp = players.map((_, i) => (last.hcp && last.hcp[i] != null ? String(last.hcp[i]) : ''));
    go({ screen: 'setup', form: {
      fmt: last.fmt || 'acp', players, hcp, course: last.course || '',
      courseId: last.courseId !== undefined ? last.courseId : COURSES[0].id, mode: last.mode || 'brut',
      count: 18, start: 1, error: ''
    } });
  },
  addPlayer() {
    const f = S.ui.form;
    if (f.players.length >= 4) return;
    f.players.push(''); f.hcp.push(''); f.error = ''; save(); render();
    const ins = document.querySelectorAll('[data-field=player]'); ins[ins.length - 1].focus();
  },
  removePlayer(el) { const f = S.ui.form; f.players.splice(+el.dataset.i, 1); f.hcp.splice(+el.dataset.i, 1); f.error = ''; save(); render(); },
  setCount(el) { S.ui.form.count = +el.dataset.v; save(); render(); },
  setFmt(el) {
    const f = S.ui.form;
    f.fmt = el.dataset.v; f.error = '';
    while (f.players.length < minPlayers(f)) { f.players.push(''); f.hcp.push(''); }
    save(); render();
  },
  setMode(el) { const f = S.ui.form; if (el.dataset.v === 'net' && !f.courseId) return; f.mode = el.dataset.v; f.error = ''; save(); render(); },
  startGame() {
    const f = S.ui.form;
    const is420 = f.fmt === '420';
    const fail = (msg) => { f.error = msg; save(); render(); };
    const names = f.players.map((p, i) => p.trim() || `Joueur ${i + 1}`);
    const lower = names.map((n) => n.toLowerCase());
    if (new Set(lower).size !== lower.length) return fail('Deux joueurs ont le même prénom. Ajoutez une initiale pour les distinguer.');
    const holeNums = holeNumbers(f.count, f.start);
    let g;
    if (!is420) {
      g = {
        id: uid(), created: new Date().toISOString(), fmt: 'acp', course: f.course.trim(), players: names, status: 'playing',
        holes: holeNums.map((n) => ({ n, a: null, c: null, p: null, done: false }))
      };
    } else {
      if (names.length < 3) return fail('Le 4-2-0 se joue à 3 ou 4 joueurs.');
      const course = courseById(f.courseId);
      const mode = course && f.mode === 'net' ? 'net' : 'brut';
      let hcp = names.map(() => 0);
      if (mode === 'net') {
        hcp = f.hcp.map((v) => String(v ?? '').trim());
        if (hcp.some((v) => !/^\d{1,2}$/.test(v) || +v > 54)) return fail('Indiquez le handicap de jeu de chaque joueur (nombre entier de 0 à 54).');
        hcp = hcp.map(Number);
      }
      g = {
        id: uid(), created: new Date().toISOString(), fmt: '420', mode, courseId: course ? course.id : '',
        course: course ? course.name : f.course.trim(), players: names, hcp, status: 'playing',
        holes: holeNums.map((n) => {
          const par = course ? course.holes[n - 1][0] : null;
          const si = course ? course.holes[n - 1][1] : null;
          return { n, par, si, s: names.map(() => par || 4), done: false };
        })
      };
    }
    S.games.push(g);
    S.last = { players: names, course: f.course.trim(), fmt: f.fmt, courseId: f.courseId, mode: f.mode, hcp: f.hcp.map((v) => String(v ?? '').trim()) };
    go({ screen: 'hole', gameId: g.id, holeIdx: 0 });
  },
  step(el) {
    const g = getGame(S.ui.gameId);
    const hole = editableHole(g);
    const i = +el.dataset.i, d = +el.dataset.d;
    const s = hole.s[i];
    hole.s[i] = s === PICKED ? (hole.par || 4) : Math.min(15, Math.max(1, s + d));
    save(); render();
  },
  pickUp(el) {
    const g = getGame(S.ui.gameId);
    const hole = editableHole(g);
    const i = +el.dataset.i;
    hole.s[i] = hole.s[i] === PICKED ? (hole.par || 4) : PICKED;
    save(); render();
  },

  resume() {
    const g = activeGame() || getGame(S.ui.gameId);
    if (!g) return A.home();
    go({ screen: 'hole', gameId: g.id, holeIdx: currentIdx(g) });
  },
  async abandon() {
    const g = activeGame();
    if (!g || !(await confirmBox('Abandonner et supprimer la partie en cours ?', 'Abandonner la partie', true))) return;
    S.games = S.games.filter((x) => x.id !== g.id);
    go({ screen: 'home' });
  },

  pick(el) {
    const g = getGame(S.ui.gameId);
    const hole = editableHole(g);
    const k = el.dataset.k, i = +el.dataset.i;
    hole[k] = hole[k] === i ? null : i;
    save(); render();
  },
  async validate() {
    const g = getGame(S.ui.gameId);
    const hole = g.holes[S.ui.holeIdx];
    const missing = fmtOf(g) === '420' ? [] : CATS.filter((c) => hole[c.k] === null).map((c) => c.name);
    if (missing.length) {
      const msg = `${missing.length > 1 ? 'Points non attribués' : 'Point non attribué'} : <b>${missing.join(', ')}</b>.<br>Valider le trou ${hole.n} quand même ?`;
      if (!(await confirmBox(msg, 'Valider quand même'))) return;
    }
    hole.done = true;
    const next = currentIdx(g);
    if (next === -1) { g.status = 'finished'; go({ screen: 'card', gameId: g.id }); toast('Partie terminée 🎉'); }
    else { go({ screen: 'hole', gameId: g.id, holeIdx: next }); toast(`Trou ${hole.n} validé ✓`); }
  },

  openCard(el) { go({ screen: 'card', gameId: el.dataset.id || S.ui.gameId }); },
  openHole(el) {
    const g = getGame(S.ui.gameId);
    const idx = +el.dataset.idx;
    const ho = g.holes[idx];
    if (g.status === 'playing' && idx === currentIdx(g)) return go({ screen: 'hole', gameId: g.id, holeIdx: idx });
    if (!ho.done) return toast('Ce trou n\'a pas encore été joué');
    go({ screen: 'hole', gameId: g.id, holeIdx: idx, draft: JSON.parse(JSON.stringify(ho)) });
  },
  saveEdit() {
    const g = getGame(S.ui.gameId);
    g.holes[S.ui.holeIdx] = { ...S.ui.draft, done: true };
    const n = S.ui.draft.n;
    go({ screen: 'card', gameId: g.id });
    toast(`Trou ${n} corrigé ✓`);
  },
  cancelEdit() { go({ screen: 'card', gameId: S.ui.gameId }); },

  async deleteGame() {
    const g = getGame(S.ui.gameId);
    if (!(await confirmBox('Supprimer définitivement cette partie ?', 'Supprimer', true))) return;
    S.games = S.games.filter((x) => x.id !== g.id);
    go({ screen: 'home' });
  },
  share() { shareCard(getGame(S.ui.gameId)); }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !A[el.dataset.act]) return;
  A[el.dataset.act](el);
});
document.addEventListener('input', (e) => {
  const el = e.target, f = S.ui.form;
  if (!f || !el.dataset.field) return;
  if (el.dataset.field === 'player') f.players[+el.dataset.i] = el.value;
  else if (el.dataset.field === 'course') f.course = el.value;
  else if (el.dataset.field === 'hcp') f.hcp[+el.dataset.i] = el.value.replace(/\D/g, '');
  else if (el.dataset.field === 'courseId') {
    if (f.courseId === el.value) return;
    f.courseId = el.value;
    if (!f.courseId) f.mode = 'brut';
    f.error = ''; save(); render(); return;
  }
  else if (el.dataset.field === 'start') { f.start = +el.value; const s = document.getElementById('seq'); if (s) s.textContent = seqText(f); }
  f.error = '';
  save();
});
document.addEventListener('change', (e) => {
  const fld = e.target.dataset.field;
  if (fld === 'start' || fld === 'courseId') e.target.dispatchEvent(new Event('input', { bubbles: true }));
});

/* ---------- Image de la carte de score ---------- */
function drawCard(g) {
  const W = 1080, P = 56, n = g.players.length;
  const F = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
  const is420 = fmtOf(g) === '420';
  const r = ranking(g);
  const t = anyTotals(g);
  const bandH = 210, rankRowH = 70, rowH = is420 ? 66 : 56, holeColW = 130;
  const colW = (W - 2 * P - holeColW) / n;
  const tableTop = bandH + 40 + r.length * rankRowH + 40;
  const H = tableTop + rowH * (g.holes.length + 2) + 170;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const fit = (s, maxW) => { if (x.measureText(s).width <= maxW) return s; while (s.length > 1 && x.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; };

  x.fillStyle = '#F5F1E8'; x.fillRect(0, 0, W, H);
  // Bandeau
  x.fillStyle = '#1F4D3A'; x.fillRect(0, 0, W, bandH);
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `800 58px ${F}`; x.fillText(is420 ? fmtLabel(g).replace(' (la Chouette)', ' · la Chouette') : 'Approche · Chip · Putt', W / 2, 78);
  x.font = `500 32px ${F}`; x.fillStyle = 'rgba(255,255,255,.88)';
  x.fillText(fit((g.course ? g.course + ' · ' : '') + fmtDate(g.created, true), W - 2 * P), W / 2, 140);
  x.font = `600 26px ${F}`; x.fillStyle = 'rgba(255,255,255,.7)';
  x.fillText(`${g.holes.length} trous${g.status === 'playing' ? ' · partie en cours' : ''}`, W / 2, 182);

  // Classement
  let y = bandH + 40;
  r.forEach((o) => {
    x.fillStyle = o.rank === 1 ? '#E6EFE9' : '#fff';
    roundRect(x, P, y, W - 2 * P, rankRowH - 10, 14); x.fill();
    x.textAlign = 'left'; x.fillStyle = '#5E6A63'; x.font = `800 30px ${F}`;
    x.fillText(rankLabel(o.rank), P + 24, y + (rankRowH - 10) / 2);
    x.fillStyle = '#18211D'; x.font = `700 34px ${F}`;
    x.fillText(fit(o.n, 480), P + 110, y + (rankRowH - 10) / 2);
    x.textAlign = 'right'; x.font = `800 36px ${F}`;
    x.fillText(`${o.pts} pt${o.pts > 1 ? 's' : ''}`, W - P - 24, y + (rankRowH - 10) / 2);
    x.font = `600 22px ${F}`; x.fillStyle = '#5E6A63';
    x.fillText(is420 ? `${o.cum} pts cumulés` : `${o.a} A · ${o.c} C · ${o.p} P`, W - P - 170, y + (rankRowH - 10) / 2);
    y += rankRowH;
  });

  // Tableau
  y = tableTop;
  x.fillStyle = '#1F4D3A'; x.fillRect(P, y, W - 2 * P, rowH);
  x.fillStyle = '#fff'; x.font = `700 26px ${F}`; x.textAlign = 'center';
  x.fillText('Trou', P + holeColW / 2, y + rowH / 2);
  g.players.forEach((p, i) => x.fillText(fit(p, colW - 16), P + holeColW + colW * (i + 0.5), y + rowH / 2));
  y += rowH;
  g.holes.forEach((ho, k) => {
    x.fillStyle = k % 2 ? '#FAF8F2' : '#fff'; x.fillRect(P, y, W - 2 * P, rowH);
    x.fillStyle = ho.done ? '#18211D' : '#A9ADA3'; x.font = `800 26px ${F}`; x.textAlign = 'center';
    x.fillText(String(ho.n), P + holeColW / 2, y + rowH / 2 - (is420 && ho.par ? 9 : 0));
    if (is420) {
      x.font = `600 18px ${F}`; x.fillStyle = '#5E6A63';
      if (ho.par) x.fillText(`par ${ho.par}`, P + holeColW / 2, y + rowH / 2 + 19);
      x.font = `800 26px ${F}`;
      if (ho.done) {
        const hp = holePoints(g, ho);
        g.players.forEach((_, i) => {
          const cx = P + holeColW + colW * (i + 0.5);
          const s = ho.s[i];
          const rec = g.mode === 'net' ? strokesReceived(g.hcp[i], ho.si) : 0;
          x.font = `800 28px ${F}`; x.fillStyle = s === PICKED ? '#B3261E' : '#18211D';
          x.fillText((s === PICKED ? '✕' : String(s)) + (rec ? ' ' + '•'.repeat(Math.min(rec, 3)) : ''), cx, y + rowH / 2 - 9);
          x.font = `700 19px ${F}`; x.fillStyle = '#2E6B4A';
          x.fillText(`${hp[i]} pt${hp[i] > 1 ? 's' : ''}`, cx, y + rowH / 2 + 19);
        });
      }
      y += rowH;
      return;
    }
    g.players.forEach((_, i) => {
      const won = CATS.filter((c) => ho[c.k] === i);
      const cx = P + holeColW + colW * (i + 0.5);
      const R = 18, gap = 8, tw = won.length * 2 * R + (won.length - 1) * gap;
      won.forEach((c, j) => {
        const bx = cx - tw / 2 + R + j * (2 * R + gap);
        x.fillStyle = c.color; x.beginPath(); x.arc(bx, y + rowH / 2, R, 0, Math.PI * 2); x.fill();
        x.fillStyle = '#fff'; x.font = `800 20px ${F}`; x.fillText(c.letter, bx, y + rowH / 2 + 1);
      });
      if (!won.length && ho.done) { x.fillStyle = '#C6C8BF'; x.font = `700 24px ${F}`; x.fillText('·', cx, y + rowH / 2); }
    });
    y += rowH;
  });
  x.fillStyle = '#E6EFE9'; x.fillRect(P, y, W - 2 * P, rowH);
  x.fillStyle = '#1F4D3A'; x.font = `800 28px ${F}`;
  x.fillText(is420 ? 'Score' : 'Total', P + holeColW / 2, y + rowH / 2);
  t.forEach((v, i) => { x.font = `800 32px ${F}`; x.fillText(String(v.pts), P + holeColW + colW * (i + 0.5), y + rowH / 2); });
  // Lignes verticales
  x.strokeStyle = '#E4E0D5'; x.lineWidth = 2;
  for (let i = 0; i < n; i++) { const lx = P + holeColW + colW * i; x.beginPath(); x.moveTo(lx, tableTop + rowH); x.lineTo(lx, y); x.stroke(); }
  y += rowH + 50;

  // Signature en pied d'image
  x.textAlign = 'center'; x.fillStyle = '#2E6B4A'; x.font = `700 24px ${F}`;
  x.fillText(`ACP Golf · ${TAGLINE}`, W / 2, H - 38, W - 2 * P);
  x.fillStyle = '#E3AE45'; x.fillRect(W / 2 - 40, H - 76, 80, 4);
  // Légende
  if (is420) {
    x.font = `600 24px ${F}`; x.textAlign = 'center'; x.fillStyle = '#5E6A63';
    x.fillText(`Score = points cumulés − ceux du dernier · ✕ = balle ramassée${g.mode === 'net' ? ' · • = coup reçu' : ''}`, W / 2, y, W - 2 * P);
    return cv;
  }
  x.font = `600 24px ${F}`; x.textAlign = 'left';
  const items = CATS.map((c) => ({ c, label: c.name }));
  const widths = items.map((it) => 36 + 10 + x.measureText(it.label).width);
  let lx = (W - (widths.reduce((s, w) => s + w, 0) + 40 * (items.length - 1))) / 2;
  items.forEach((it, j) => {
    x.fillStyle = it.c.color; x.beginPath(); x.arc(lx + 18, y, 18, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff'; x.font = `800 20px ${F}`; x.textAlign = 'center'; x.fillText(it.c.letter, lx + 18, y + 1);
    x.fillStyle = '#5E6A63'; x.font = `600 24px ${F}`; x.textAlign = 'left'; x.fillText(it.label, lx + 46, y);
    lx += widths[j] + 40;
  });
  return cv;
}
function roundRect(x, X, Y, w, h, r) {
  x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
  x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
}
function dataURLtoBlob(u) {
  const bin = atob(u.split(',')[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: 'image/png' });
}
async function shareCard(g) {
  // Tout est synchrone jusqu'à navigator.share pour conserver le « geste utilisateur » exigé par iOS.
  const url = drawCard(g).toDataURL('image/png');
  const fname = `${fmtOf(g) === '420' ? '4-2-0' : 'approche-chip-putt'}-${g.created.slice(0, 10)}.png`;
  let file = null;
  try { file = new File([dataURLtoBlob(url)], fname, { type: 'image/png' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Carte de score – ' + fmtLabel(g) }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="overlay"><div class="sheet"><img src="${url}" alt="Carte de score">
    <p class="small muted" style="font-size:15px">Appui long sur l'image pour l'enregistrer ou la partager.</p>
    <div class="btns"><a class="btn btn-primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="${url}" download="${fname}">Télécharger l'image</a>
    <button class="btn btn-secondary" id="mNo">Fermer</button></div></div></div>`;
  m.querySelector('#mNo').onclick = () => { m.innerHTML = ''; };
}

/* ---------- Démarrage ---------- */
render();
// Écran de lancement : s'efface tout seul (ou au toucher)
(function () {
  const sp = document.getElementById('splash');
  if (!sp) return;
  const hide = () => {
    if (sp.classList.contains('hide')) return;
    sp.classList.add('hide');
    setTimeout(() => sp.remove(), 600);
  };
  setTimeout(hide, 1800);
  sp.addEventListener('click', hide);
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
